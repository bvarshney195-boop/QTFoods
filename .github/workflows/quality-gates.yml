name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: qtfoods_ci
      DB_USERNAME: qtfoods_ci
      DB_PASSWORD: qtfoods_ci
      QT_ALLOW_DEMO_SEEDERS: "true"
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_DB: qtfoods_ci
          POSTGRES_USER: qtfoods_ci
          POSTGRES_PASSWORD: qtfoods_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qtfoods_ci -d qtfoods_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.5"
          extensions: bcmath, pdo_pgsql, pdo_sqlite, redis
          coverage: none
          tools: composer:v2

      - name: Validate locked Composer graph
        working-directory: BackEnd
        run: composer validate --strict --no-interaction

      - name: Install backend dependencies
        working-directory: BackEnd
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit backend dependencies
        working-directory: BackEnd
        run: composer audit --locked --abandoned=fail --no-interaction

      - name: Run isolated backend suite
        working-directory: BackEnd
        run: composer test

      - name: Run PostgreSQL integrity, concurrency, and UAT regression suite
        working-directory: BackEnd
        run: vendor/bin/phpunit -c phpunit.pgsql.xml

  frontend:
    name: Frontend tests, build, and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: FrontEnd
        run: npm audit --audit-level=high

      - name: Run component suite
        working-directory: FrontEnd
        run: npm test

      - name: Type-check and build frontend
        working-directory: FrontEnd
        run: npm run build

  dependency-review:
    name: Pull-request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803 # v4.8.3
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialise CodeQL
        uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyse repository
        uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4
        with:
          category: /language:${{ matrix.language }}

  php-sast:
    name: PHP static security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Scan Laravel PHP with Semgrep
        run: node quality/run-php-security-gate.mjs

      - name: Upload PHP SAST report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: semgrep-php-report
          path: quality-results/semgrep-php.json
          if-no-files-found: warn
          retention-days: 14

  repository-security:
    name: Repository and release-image security
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run pinned Trivy gates
        run: node quality/run-repository-security-gates.mjs

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: trivy-security-reports
          path: quality-results/trivy-*.json
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: Live browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      - name: Install Chromium and operating-system dependencies
        working-directory: FrontEnd
        run: npx playwright install --with-deps chromium

      - name: Run live PostgreSQL, Redis, local private storage, and Chromium suite
        working-directory: FrontEnd
        run: npm run test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-failure-evidence
          path: FrontEnd/test-results
          if-no-files-found: ignore
          retention-days: 14

  dynamic-quality:
    name: Authenticated load and active API security
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Run k6 and ZAP against the disposable stack
        run: node quality/run-dynamic-gates.mjs

      - name: Upload dynamic quality reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dynamic-quality-reports
          path: |
            quality-results/k6-summary.json
            quality-results/zap-report.html
            quality-results/zap-report.json
            quality-results/zap-report.md
            quality-results/stack-diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

  required-quality-gate:
    name: Required quality gate
    if: always()
    needs:
      - backend
      - frontend
      - dependency-review
      - codeql
      - php-sast
      - repository-security
      - browser-e2e
      - dynamic-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          PHP_SAST_RESULT: ${{ needs.php-sast.result }}
          REPOSITORY_SECURITY_RESULT: ${{ needs.repository-security.result }}
          BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
          DYNAMIC_QUALITY_RESULT: ${{ needs.dynamic-quality.result }}
        run: |
          failed=0
          for result in \
            "$BACKEND_RESULT" \
            "$FRONTEND_RESULT" \
            "$CODEQL_RESULT" \
            "$PHP_SAST_RESULT" \
            "$REPOSITORY_SECURITY_RESULT" \
            "$BROWSER_E2E_RESULT" \
            "$DYNAMIC_QUALITY_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          done

          if [[ "$DEPENDENCY_REVIEW_RESULT" != "success" && "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]]; then
            failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            echo "At least one required quality gate did not pass."
            exit 1
          fi

          echo "All applicable quality gates passed."
