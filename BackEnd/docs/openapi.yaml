    ReportRun:
      type: object
      required: [id, run_number, report_code, report_title, status, as_of_at, source_freshness_at, parameters, columns, row_count, totals, sha256, record_version, generated_at, created_at, created_by]
      properties:
        id: { type: string, format: uuid }
        run_number: { type: string }
        report_code:
          type: string
          enum: [TRIAL_BALANCE, RECEIVABLE_AGING, INVENTORY_AVAILABILITY, ORDER_FULFILMENT]
        report_title: { type: string }
        status: { type: string, enum: [GENERATED] }
        as_of_at: { type: string, format: date-time }
        source_freshness_at: { type: string, format: date-time }
        parameters:
          type: object
          additionalProperties: { type: boolean }
        columns:
          type: array
          items: { $ref: "#/components/schemas/ReportColumn" }
        row_count: { type: integer, minimum: 0 }
        totals:
          type: object
          additionalProperties: { type: [string, number] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        record_version: { type: integer, minimum: 1 }
        generated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/EntityReference" }
        definition: { $ref: "#/components/schemas/ReportDefinition" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ReportRow" }
        exports:
          type: array
          items: { $ref: "#/components/schemas/ReportExport" }
        allowed_actions:
          type: array
          items: { type: string, enum: [EXPORT] }
    ReportingWorkspace:
      type: object
      required: [data, meta, summary, definitions, allowed_actions]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReportRun" }
        meta:
          type: object
          required: [total]
          properties:
            total: { type: integer, minimum: 0 }
        summary:
          type: object
          required: [total_runs, rows_snapshotted, exports_created, latest_freshness_at]
          properties:
            total_runs: { type: integer, minimum: 0 }
            rows_snapshotted: { type: integer, minimum: 0 }
            exports_created: { type: integer, minimum: 0 }
            latest_freshness_at: { type: [string, "null"], format: date-time }
        definitions:
          type: array
          items: { $ref: "#/components/schemas/ReportDefinition" }
        allowed_actions:
          type: array
          items: { type: string, enum: [RUN, EXPORT] }
    HelpArticleSection:
      type: object
      required: [heading, content]
      properties:
        heading: { type: string }
        content: { type: string }
    HelpArticle:
      type: object
      required: [id, slug, category, related_screen_code, title, summary, content_version, published_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string, pattern: '^[a-z0-9-]+$' }
        category:
          type: string
          enum: [GETTING_STARTED, WORKFLOWS, CONTROLS, SECURITY, REPORTING]
        related_screen_code: { type: [string, "null"] }
        title: { type: string }
        summary: { type: string }
        content_version: { type: integer, minimum: 1 }
        published_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        sections:
          type: array
          items: { $ref: "#/components/schemas/HelpArticleSection" }
    HelpSupportCaseEvent:
      type: object
      required: [id, sequence_number, event_type, status_from, status_to, message, actor, created_at]
      properties:
        id: { type: string, format: uuid }
        sequence_number: { type: integer, minimum: 1 }
        event_type:
          type: string
          enum: [CREATED, COMMENTED, STARTED, RESOLVED, REOPENED, CLOSED]
        status_from: { type: [string, "null"] }
        status_to: { type: [string, "null"] }
        message: { type: string }
        actor: { $ref: "#/components/schemas/EntityReference" }
        created_at: { type: string, format: date-time }
    HelpSupportCase:
      type: object
      required: [id, case_number, category, priority, affected_screen_code, subject, description, status, record_version, requester, assigned_to, resolution_summary, resolved_at, closed_at, created_at, updated_at, allowed_actions]
      properties:
        id: { type: string, format: uuid }
        case_number: { type: string }
        category:
          type: string
          enum: [ACCESS, DATA, WORKFLOW, INTEGRATION, REPORTING, OTHER]
        priority: { type: string, enum: [LOW, NORMAL, HIGH, CRITICAL] }
        affected_screen_code: { type: [string, "null"], maxLength: 32 }
        subject: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 8000 }
        status: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
        record_version: { type: integer, minimum: 1 }
        requester: { $ref: "#/components/schemas/EntityReference" }
        assigned_to:
          oneOf:
            - $ref: "#/components/schemas/EntityReference"
            - type: "null"
        resolution_summary: { type: [string, "null"] }
        resolved_at: { type: [string, "null"], format: date-time }
        resolved_by:
          oneOf:
            - $ref: "#/components/schemas/EntityReference"
            - type: "null"
        closed_at: { type: [string, "null"], format: date-time }
        closed_by:
          oneOf:
            - $ref: "#/components/schemas/EntityReference"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        allowed_actions:
          type: array
          items: { type: string, enum: [COMMENT, START, RESOLVE, REOPEN, CLOSE] }
        events:
          type: array
          items: { $ref: "#/components/schemas/HelpSupportCaseEvent" }
    HelpSupportCaseCreateCommand:
      type: object
      required: [category, priority, subject, description]
      properties:
        category:
          type: string
          enum: [ACCESS, DATA, WORKFLOW, INTEGRATION, REPORTING, OTHER]
        priority: { type: string, enum: [LOW, NORMAL, HIGH, CRITICAL] }
        affected_screen_code:
          type: [string, "null"]
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
        subject: { type: string, minLength: 3, maxLength: 200 }
        description: { type: string, minLength: 10, maxLength: 8000 }
    HelpWorkspace:
      type: object
      required: [articles, cases, summary, lookups, allowed_actions, is_support_manager]
      properties:
        articles:
          type: array
          items: { $ref: "#/components/schemas/HelpArticle" }
        cases:
          type: array
          items: { $ref: "#/components/schemas/HelpSupportCase" }
        summary:
          type: object
          required: [published_articles, visible_cases, open_cases, critical_open_cases]
          properties:
            published_articles: { type: integer, minimum: 0 }
            visible_cases: { type: integer, minimum: 0 }
            open_cases: { type: integer, minimum: 0 }
            critical_open_cases: { type: integer, minimum: 0 }
        lookups:
          type: object
          required: [case_categories, priorities, statuses, article_categories, screen_codes]
          properties:
            case_categories:
              type: array
              items: { type: string, enum: [ACCESS, DATA, WORKFLOW, INTEGRATION, REPORTING, OTHER] }
            priorities:
              type: array
              items: { type: string, enum: [LOW, NORMAL, HIGH, CRITICAL] }
            statuses:
              type: array
              items: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
            article_categories:
              type: array
              items: { type: string, enum: [GETTING_STARTED, WORKFLOWS, CONTROLS, SECURITY, REPORTING] }
            screen_codes:
              type: array
              items: { type: string }
        allowed_actions:
          type: array
          items: { type: string, enum: [CREATE, COMMENT, REOPEN, CLOSE, MANAGE] }
        is_support_manager: { type: boolean }
    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page, from, to]
      properties:
        current_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        last_page: { type: integer, minimum: 1 }
        from: { type: [integer, "null"] }
        to: { type: [integer, "null"] }
    PaginationLinks:
      type: object
      required: [first, last, prev, next]
      properties:
        first: { type: string }
        last: { type: string }
        prev: { type: [string, "null"] }
        next: { type: [string, "null"] }
    ApiErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
