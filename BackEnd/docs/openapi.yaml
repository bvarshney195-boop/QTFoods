openapi: 3.1.0
info:
  title: Q & T FOODS LTD ERP + CRM API
  version: 3.1.0
  description: Session-authenticated, role- and context-scoped ERP API.
servers:
  - url: /api/v1

paths:
  /auth/csrf:
    get:
      summary: Start or refresh a browser session and CSRF token
      security: []
      responses:
        "200":
          description: CSRF token issued
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [csrf_token]
                    properties:
                      csrf_token: { type: string }

  /auth/login:
    post:
      summary: Authenticate a named ERP user
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          $ref: "#/components/responses/ErpSession"
        "202":
          description: Password accepted; a second factor is required
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaChallenge" }
        "403":
          description: Credentials are valid but the email address is not verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/mfa/challenge:
    post:
      operationId: completeMfaLoginChallenge
      summary: Complete a pending password login with TOTP or an unused recovery code
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, maxLength: 32 }
      responses:
        "200": { $ref: "#/components/responses/ErpSession" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/invitations/{token}:
    parameters:
      - $ref: "#/components/parameters/IdentityToken"
    get:
      operationId: inspectUserInvitation
      summary: Inspect a valid, pending user invitation
      security: []
      responses:
        "200":
          description: Invitation recipient and scoped organisation metadata
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublicInvitation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/invitations/accept:
    post:
      operationId: acceptUserInvitation
      summary: Accept a one-time invitation, choose a password, verify email, and activate the user
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PasswordConfirmation"
                - type: object
                  required: [token]
                  properties:
                    token: { type: string, minLength: 64, maxLength: 64, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/IdentityCompletion" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      summary: Request a one-time password reset without revealing account existence
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        $ref: "#/components/requestBodies/IdentityEmail"
      responses:
        "202": { $ref: "#/components/responses/IdentityRequestAccepted" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Consume a one-time reset link, replace the password, and revoke every device session
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PasswordConfirmation"
                - type: object
                  required: [email, token]
                  properties:
                    email: { type: string, format: email }
                    token: { type: string, minLength: 64, maxLength: 64, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/IdentityCompletion" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/email/verification/request:
    post:
      operationId: requestEmailVerification
      summary: Request a one-time email-verification link without revealing account state
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        $ref: "#/components/requestBodies/IdentityEmail"
      responses:
        "202": { $ref: "#/components/responses/IdentityRequestAccepted" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/email/verify:
    post:
      operationId: verifyEmail
      summary: Consume a one-time email-verification link
      security: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token]
              properties:
                email: { type: string, format: email }
                token: { type: string, minLength: 64, maxLength: 64, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/IdentityCompletion" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me:
    get:
      summary: Restore the authenticated ERP session
      security:
        - sessionCookie: []
      responses:
        "200":
          $ref: "#/components/responses/ErpSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/logout:
    post:
      summary: Invalidate the authenticated session
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session invalidated
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/password/change:
    post:
      operationId: changePassword
      summary: Change the authenticated user's password and revoke all other devices
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PasswordConfirmation"
                - type: object
                  required: [current_password]
                  properties:
                    current_password: { type: string, format: password, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/IdentityCompletion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/mfa/setup:
    post:
      operationId: beginMfaSetup
      summary: Start encrypted TOTP enrolment after current-password confirmation
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: { type: string, format: password, writeOnly: true }
      responses:
        "200":
          description: Manual secret and standard otpauth URI valid for the short setup window
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MfaSetup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/mfa/confirm:
    post:
      operationId: confirmMfaSetup
      summary: Verify TOTP setup and return a new recovery-code set exactly once
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\d{6}$' }
      responses:
        "200": { $ref: "#/components/responses/MfaRecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/mfa/disable:
    post:
      operationId: disableMfa
      summary: Disable MFA after password and second-factor confirmation and revoke other devices
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, code]
              properties:
                current_password: { type: string, format: password, writeOnly: true }
                code: { type: string, maxLength: 32, writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/IdentityCompletion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/mfa/recovery-codes:
    post:
      operationId: regenerateMfaRecoveryCodes
      summary: Invalidate every earlier recovery code and return a replacement set exactly once
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, code]
              properties:
                current_password: { type: string, format: password, writeOnly: true }
                code: { type: string, pattern: '^\d{6}$', writeOnly: true }
      responses:
        "200": { $ref: "#/components/responses/MfaRecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/sessions:
    get:
      operationId: listOwnDeviceSessions
      summary: List the authenticated user's logical device sessions
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/DeviceSessions" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/sessions/revoke-others:
    post:
      operationId: revokeOtherDeviceSessions
      summary: Revoke all of the authenticated user's devices except the current one
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200": { $ref: "#/components/responses/IdentityCompletion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  /auth/sessions/{sessionId}/revoke:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: revokeOwnDeviceSession
      summary: Revoke one owned logical device session, including the current device
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200": { $ref: "#/components/responses/IdentityCompletion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }

  /contexts:
    get:
      summary: List company and plant contexts assigned to the user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authorised contexts and current selection
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /contexts/select:
    post:
      summary: Select an authorised company and plant
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id]
              properties:
                company_id: { type: string, format: uuid }
                plant_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          $ref: "#/components/responses/ErpSession"
        "422":
          $ref: "#/components/responses/ValidationError"

  /work/tasks:
    get:
      operationId: listWorkItems
      summary: List persisted work visible to the user in the selected context
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: status
          schema: { type: string, enum: [OPEN, COMPLETED, CANCELLED, ALL], default: OPEN }
        - in: query
          name: kind
          schema: { type: string, enum: [APPROVAL, TASK, EXCEPTION] }
        - in: query
          name: priority
          schema: { type: string, enum: [URGENT, HIGH, NORMAL, LOW] }
        - in: query
          name: assignment
          schema: { type: string, enum: [ALL, MINE, UNASSIGNED], default: ALL }
        - in: query
          name: overdue
          schema: { type: boolean, default: false }
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [priority, -priority, due_at, -due_at, created_at, -created_at]
            default: priority
      responses:
        "200":
          description: Permission- and ownership-filtered work items plus live counters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkQueue" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ContextRequired"

  /work/tasks/{workItemId}/claim:
    post:
      operationId: claimWorkItem
      summary: Claim an unassigned work item for the current user
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200": { $ref: "#/components/responses/WorkItemCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /work/tasks/{workItemId}/assign:
    post:
      operationId: assignWorkItem
      summary: Assign or unassign a work item as an authorised ERP manager
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigned_user_id]
              properties:
                assigned_user_id: { type: [string, "null"], format: uuid }
      responses:
        "200": { $ref: "#/components/responses/WorkItemCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /work/tasks/{workItemId}/complete:
    post:
      operationId: completeWorkItem
      summary: Complete assigned task or exception work
      description: Approval work is completed only by the corresponding approval decision endpoint.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/WorkItemId"
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                completion_note: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/WorkItemCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/organisation:
    get:
      operationId: getOrganisationWorkspace
      summary: Read the selected organisation and all of its plants
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Organisation, plant register, live counts, and allowed actions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganisationWorkspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ContextRequired" }

  /admin/companies:
    post:
      operationId: createCompany
      summary: Create an active organisation, first plant, and creator administrator assignment
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, legal_name, display_name, plant_code, plant_name, timezone]
              properties:
                code: { type: string, maxLength: 32, pattern: '^[A-Z0-9][A-Z0-9_-]*$' }
                legal_name: { type: string, maxLength: 255 }
                display_name: { type: string, maxLength: 255 }
                plant_code: { type: string, maxLength: 32, pattern: '^[A-Z0-9][A-Z0-9_-]*$' }
                plant_name: { type: string, maxLength: 255 }
                timezone: { type: string, maxLength: 64 }
      responses:
        "201": { $ref: "#/components/responses/FoundationCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/companies/{companyId}:
    parameters:
      - $ref: "#/components/parameters/CompanyId"
    get:
      operationId: getCompany
      summary: Read the organisation in the selected scope
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/CompanyRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: updateCompany
      summary: Update the selected organisation using lifecycle deactivation instead of deletion
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [legal_name, display_name, status]
              properties:
                legal_name: { type: string, maxLength: 255 }
                display_name: { type: string, maxLength: 255 }
                status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
      responses:
        "200": { $ref: "#/components/responses/FoundationCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/plants:
    post:
      operationId: createPlant
      summary: Create a plant and grant the creator protected administration there
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, timezone, status]
              properties:
                code: { type: string, maxLength: 32, pattern: '^[A-Z0-9][A-Z0-9_-]*$' }
                name: { type: string, maxLength: 255 }
                timezone: { type: string, maxLength: 64 }
                status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
      responses:
        "201": { $ref: "#/components/responses/FoundationCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/plants/{plantId}:
    parameters:
      - $ref: "#/components/parameters/PlantId"
    get:
      operationId: getPlant
      summary: Read a plant in the selected organisation
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/PlantRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: updatePlant
      summary: Update a plant after checking dependent locations, assignments, and work
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, timezone, status]
              properties:
                name: { type: string, maxLength: 255 }
                timezone: { type: string, maxLength: 64 }
                status: { type: string, enum: [DRAFT, ACTIVE, INACTIVE] }
      responses:
        "200": { $ref: "#/components/responses/FoundationCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/locations:
    get:
      operationId: listLocations
      summary: List location hierarchy records in the selected plant
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: status, schema: { type: string, enum: [ACTIVE, INACTIVE] } }
        - { in: query, name: location_type, schema: { $ref: "#/components/schemas/LocationType" } }
      responses:
        "200":
          description: Scoped locations, stock dependency counts, parent lookups, and summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationWorkspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ContextRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      operationId: createLocation
      summary: Create a location in the selected plant hierarchy
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/LocationCreate"
      responses:
        "201": { $ref: "#/components/responses/FoundationCommand" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/locations/{locationId}:
    parameters:
      - $ref: "#/components/parameters/LocationId"
    get:
      operationId: getLocation
      summary: Read a location and its hierarchy and stock dependencies
      security: [{ sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/LocationRecord" }
