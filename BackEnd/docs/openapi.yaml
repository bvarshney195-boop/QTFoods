                  data: { $ref: "#/components/schemas/UnsoldReturnLookups" }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ContextRequired"
        "422":
          $ref: "#/components/responses/ValidationError"

  /sales/unsold-return-approvals:
    get:
      operationId: listUnsoldReturnApprovals
      summary: List loss-disposition approvals visible to an authorised reviewer
      description: Requires at least one direct or delegated RET-UNSOLD approval authority. Results are limited to the selected company and plant; can_decide requires the request's exact snapshotted authority and also reflects maker-checker and source-version validity.
      security:
        - sessionCookie: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: sort
          schema: { type: string, enum: [created_at, -created_at, status, -status], default: -created_at }
      responses:
        "200":
          description: Scoped approval queue
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/UnsoldReturnApprovalListItem" }
                  meta: { $ref: "#/components/schemas/PaginationMeta" }
                  links: { $ref: "#/components/schemas/PaginationLinks" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/ContextRequired" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sales/unsold-return-approvals/{approvalId}:
    get:
      operationId: getUnsoldReturnApproval
      summary: Get a scoped loss-disposition approval with lines and decision history
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApprovalId"
      responses:
        "200":
          description: Approval detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UnsoldReturnApprovalDetail" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ContextRequired" }

  /sales/unsold-return-approvals/{approvalId}/approve:
    post:
      operationId: approveUnsoldReturnApproval
      summary: Approve an unsold-return loss disposition
      description: Requires the exact current snapshotted authority, held directly or through a currently valid delegation, a reviewer different from the disposition maker, a pending approval version, and an unchanged source return case. Approval atomically moves positive restock, repack, and rework quantities from return quarantine to their configured plant outcome positions.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: Non-destroy outcome stock posted, disposition approved, and Finance loss posting unlocked
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UnsoldReturnApprovalDecisionResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /sales/unsold-return-approvals/{approvalId}/reject:
    post:
      operationId: rejectUnsoldReturnApproval
      summary: Reject an unsold-return loss disposition back to Quality
      description: Requires the exact current snapshotted direct or delegated authority. Rejection records the reviewer reason, increments the source case version, returns the case to RETURN_QUARANTINE, and links the next corrected submission to this rejected request.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/ApprovalId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 2000 }
      responses:
        "200":
          description: Disposition rejected and returned to Quality
          content:
            application/json:
              schema:
