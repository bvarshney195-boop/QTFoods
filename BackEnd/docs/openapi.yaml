                document_number: { type: string, maxLength: 80, pattern: '^[A-Z0-9][A-Z0-9_/-]*$' }
                document_type: { type: string, enum: [ORDER_CONFIRMATION, SHIPPING_DOCUMENT, INVOICE, CLAIM_EVIDENCE, QUALITY_CERTIFICATE, GENERAL] }
                title: { type: string, minLength: 3, maxLength: 200 }
                description: { type: string, maxLength: 4000 }
                sales_order_id: { type: string, format: uuid }
                shipment_id: { type: string, format: uuid }
                invoice_id: { type: string, format: uuid }
                customer_claim_id: { type: string, format: uuid }
                file: { type: string, format: binary, description: "PDF, PNG, JPEG, CSV, or text file up to 20 MiB." }
      responses: *p2CreateResponses

  /partner/documents/{documentId}:
    parameters:
      - { in: path, name: documentId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPartnerDocument
      summary: Get scoped document metadata, checksum, links, receipt events, and permitted commands without exposing its storage path
      security: [{ sessionCookie: [] }]
      responses: *p2DetailResponses

  /partner/documents/{documentId}/download:
    parameters:
      - { in: path, name: documentId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadPartnerDocument
      summary: Stream private document bytes after scope, party, entitlement, and action-permission checks
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Private partner document bytes
          headers:
            X-Content-SHA256:
              schema: { type: string, pattern: '^[a-f0-9]{64}$' }
            X-Partner-Direction:
              schema: { type: string, enum: [INBOUND, OUTBOUND] }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ContextRequired" }

  /partner/documents/{documentId}/acknowledge:
    parameters:
      - { in: path, name: documentId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: acknowledgePartnerDocumentReceipt
      summary: Record receipt of an available outbound document without approving any linked internal workflow
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody: *p2JsonCommandBody
      responses: *p2CommandResponses

  /partner/documents/{documentId}/withdraw:
    parameters:
      - { in: path, name: documentId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: withdrawPartnerDocument
      summary: Reason-withdraw an unacknowledged outbound document from the internal administration side
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody: *p2JsonCommandBody
      responses: *p2CommandResponses

  /optimisation/plans:
    get:
      operationId: listOptimisationPlans
      summary: Browse scoped optimisation plans, lifecycle counters, and released demand sources
      description: Returns only the selected company and plant. Current immutable input metadata, recommendation and outcome counts, visible warning counts, and permitted commands accompany each plan.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 160 }
        - in: query
          name: status
          schema: { type: string, enum: [DRAFT, GENERATED, SUBMITTED, APPROVED, REJECTED, COMPLETED, CANCELLED] }
        - in: query
          name: objective
          schema: { type: string, enum: [BALANCED, SERVICE, COST, INVENTORY] }
        - in: query
          name: sort
          schema: { type: string, enum: [NEWEST, OLDEST, NUMBER, HORIZON, STATUS] }
        - in: query
          name: per_page
          schema: { type: integer, enum: [10, 25, 50, 100], default: 25 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses: *p2WorkspaceResponses
    post:
      operationId: createOptimisationPlan
      summary: Create a plan and capture immutable input version 1 from exact released demand, stock, MRP, and cost facts
      security: [{ sessionCookie: [] }]
      parameters: *p2CreateHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OptimisationCreateCommand" }
      responses: *p2CreateResponses

  /optimisation/plans/{planId}:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOptimisationPlan
      summary: Get immutable input history, current recommendations and limitations, independent reviews, and measured outcomes
      security: [{ sessionCookie: [] }]
      responses: *p2DetailResponses

  /optimisation/plans/{planId}/inputs:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reviseOptimisationInput
      summary: Capture a complete new immutable input version while preserving earlier recommendations and reviews
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OptimisationInputCommand" }
      responses: *p2CommandResponses

  /optimisation/plans/{planId}/generate:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: generateOptimisationRecommendations
      summary: Generate deterministic net-requirement recommendations and persist explicit model, capacity, material, stock, service, and cost limitations
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      responses: *p2CommandResponses

  /optimisation/plans/{planId}/submit:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: submitOptimisationPlan
      summary: Freeze the current recommendation version and submit it for independent human review
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      responses: *p2CommandResponses

  /optimisation/plans/{planId}/approve:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: approveOptimisationPlan
      summary: Independently approve the submitted recommendation set without executing production or postings
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision_notes]
              properties:
                decision_notes: { type: string, minLength: 3, maxLength: 4000 }
      responses: *p2CommandResponses

  /optimisation/plans/{planId}/reject:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: rejectOptimisationPlan
      summary: Independently reject the submitted recommendation set and require a fresh input version before resubmission
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision_notes]
              properties:
                decision_notes: { type: string, minLength: 3, maxLength: 4000 }
      responses: *p2CommandResponses

  /optimisation/plans/{planId}/recommendations/{recommendationId}/outcome:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: recommendationId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: saveOptimisationOutcome
      summary: Record or optimistically replace the measured outcome for one current approved recommendation
      description: Outcome evidence is tracked separately and does not post stock, production, or finance. Replacing an existing observation requires expected_outcome_version in addition to the plan If-Match header.
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result, actual_stock_quantity, actual_production_quantity, actual_service_level, actual_cost, currency, observed_on, notes]
              properties:
                result: { type: string, enum: [ACHIEVED, PARTIAL, MISSED] }
                actual_stock_quantity: { type: [number, string], minimum: 0 }
                actual_production_quantity: { type: [number, string], minimum: 0 }
                actual_service_level: { type: [number, string], exclusiveMinimum: 0, maximum: 100 }
                actual_cost: { type: [number, string], minimum: 0 }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                observed_on: { type: string, format: date }
                notes: { type: string, minLength: 3, maxLength: 4000 }
                expected_outcome_version: { type: [integer, "null"], minimum: 1 }
      responses: *p2CommandResponses

  /optimisation/plans/{planId}/complete:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: completeOptimisationPlan
      summary: Complete an approved plan only after every current recommendation has measured outcome evidence
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      responses: *p2CommandResponses

  /optimisation/plans/{planId}/cancel:
    parameters:
      - { in: path, name: planId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: cancelOptimisationPlan
      summary: Reason-cancel a draft, generated, or rejected plan while retaining all evidence
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody: *p2JsonCommandBody
      responses: *p2CommandResponses

  /reports:
    get:
      operationId: listReportRuns
      summary: Browse the controlled report catalog and immutable scoped run history
      description: Returns only generated runs in the selected company and plant, with cutoff, source-freshness, row-count, total, and checksum metadata.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: report_code
          schema: { type: string, enum: [TRIAL_BALANCE, RECEIVABLE_AGING, INVENTORY_AVAILABILITY, ORDER_FULFILMENT] }
      responses:
        "200":
          description: Reporting catalog and immutable run workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportingWorkspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /reports/runs:
    post:
      operationId: generateReportRun
      summary: Generate an immutable cutoff-bound report snapshot
      security: [{ sessionCookie: [] }]
      parameters: *p2CreateHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRunCommand" }
      responses: *p2CreateResponses

  /reports/runs/{runId}:
    parameters:
      - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getReportRun
      summary: Read stored columns, rows, totals, checksum, and export evidence for one report run
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Immutable report detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReportRun" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /reports/runs/{runId}/exports:
    parameters:
      - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createReportExport
      summary: Materialise a deterministic CSV or JSON export from stored report rows
      security: [{ sessionCookie: [] }]
      parameters: *p2CreateHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format]
              properties:
                format: { type: string, enum: [CSV, JSON] }
      responses: *p2CreateResponses

  /reports/exports/{exportId}/download:
    parameters:
      - { in: path, name: exportId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadReportExport
      summary: Download authenticated report-export bytes with SHA-256 response metadata
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Stored deterministic export
          headers:
            X-Content-SHA256:
              schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/help:
    get:
      operationId: getHelpWorkspace
      summary: Search role-relevant published guidance and the actor-visible scoped support queue
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: article_category
          schema: { type: string, enum: [GETTING_STARTED, WORKFLOWS, CONTROLS, SECURITY, REPORTING] }
        - in: query
          name: case_status
          schema: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
      responses:
        "200":
          description: Help catalog and support-case workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HelpWorkspace" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/help/articles/{slug}:
    parameters:
      - { in: path, name: slug, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' } }
    get:
      operationId: getHelpArticle
      summary: Read one published help article when its related screen is available to the current role
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Published help article
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/HelpArticle" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/help/cases:
    post:
      operationId: createHelpSupportCase
      summary: Open a support case in the selected company and plant
      security: [{ sessionCookie: [] }]
      parameters: *p2CreateHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HelpSupportCaseCreateCommand" }
      responses: *p2CreateResponses

  /admin/help/cases/{caseId}:
    parameters:
      - { in: path, name: caseId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getHelpSupportCase
      summary: Read one requester-owned or support-manager-visible case and its versioned event history
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Support-case detail
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/HelpSupportCase" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/help/cases/{caseId}/comments:
    parameters:
      - { in: path, name: caseId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: commentOnHelpSupportCase
      summary: Append a comment and advance the optimistic case version
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 2, maxLength: 4000 }
      responses: *p2CommandResponses

  /admin/help/cases/{caseId}/start:
    parameters:
      - { in: path, name: caseId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startHelpSupportCase
      summary: Assign an open case to the acting support manager and start work
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      responses: *p2CommandResponses

  /admin/help/cases/{caseId}/resolve:
    parameters:
      - { in: path, name: caseId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: resolveHelpSupportCase
      summary: Record a support-manager resolution for requester confirmation
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution_summary]
              properties:
                resolution_summary: { type: string, minLength: 5, maxLength: 4000 }
      responses: *p2CommandResponses

  /admin/help/cases/{caseId}/reopen:
    parameters:
      - { in: path, name: caseId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reopenHelpSupportCase
      summary: Reopen a resolved case while retaining its earlier resolution evidence
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 4000 }
      responses: *p2CommandResponses

  /admin/help/cases/{caseId}/close:
    parameters:
      - { in: path, name: caseId, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: closeHelpSupportCase
      summary: Confirm a recorded resolution and close the support case
      security: [{ sessionCookie: [] }]
      parameters: *p2VersionedHeaders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string, minLength: 5, maxLength: 4000 }
      responses: *p2CommandResponses

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: qt_foods_erp_session
      description: Laravel session cookie; its deployed name may be environment-specific.
  parameters:
    CsrfToken:
      in: header
      name: X-CSRF-TOKEN
      required: true
      schema: { type: string }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: A caller-generated key retained for safe replay of this exact command payload.
      schema: { type: string, maxLength: 160 }
    IfMatch:
      in: header
      name: If-Match
      required: true
      description: Current positive record version of the target aggregate, optionally expressed as a quoted or weak ETag.
      schema: { type: string, pattern: '^(?:W/)?"?[1-9][0-9]*"?$' }
    StockPositionId:
      in: path
      name: positionId
      required: true
      schema: { type: string, format: uuid }
    InventoryOwnerId:
      in: path
      name: ownerId
      required: true
      schema: { type: string, format: uuid }
    InventoryLotId:
      in: path
      name: lotId
      required: true
      schema: { type: string, format: uuid }
    StockReservationId:
      in: path
      name: reservationId
      required: true
      schema: { type: string, format: uuid }
    InventoryOperationId:
      in: path
      name: operationId
      required: true
      schema: { type: string, format: uuid }
    PurchaseRequisitionId:
      in: path
      name: requisitionId
      required: true
      schema: { type: string, format: uuid }
    PurchaseRequisitionApprovalId:
      in: path
      name: approvalId
      required: true
      schema: { type: string, format: uuid }
    PurchaseRequisitionPage:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PurchaseRequisitionPerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    PurchaseRequisitionSearch:
      in: query
      name: q
      description: Case-insensitive requisition number, department, purpose, or requester search.
      schema: { type: string, maxLength: 100 }
    RfqId:
      in: path
      name: rfqId
      required: true
      schema: { type: string, format: uuid }
    PurchaseOrderId:
      in: path
      name: purchaseOrderId
      required: true
      schema: { type: string, format: uuid }
    ProcurementPage:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    ProcurementPerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    RfqSearch:
      in: query
      name: q
      description: Case-insensitive RFQ, requisition, department, purpose, or awarded-supplier search.
      schema: { type: string, maxLength: 100 }
    PurchaseOrderSearch:
      in: query
      name: q
      description: Case-insensitive PO, RFQ, requisition, supplier code, or supplier name search.
      schema: { type: string, maxLength: 100 }
    InventoryMovementId:
      in: path
      name: movementId
      required: true
      schema: { type: string, format: uuid }
    InventoryPage:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    InventoryPerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    InventorySearch:
      in: query
      name: q
      description: Case-insensitive stock, owner, party, SKU, lot, or supplier search as applicable.
      schema: { type: string, maxLength: 100 }
    PartyId:
      in: path
      name: partyId
      required: true
      schema: { type: string, format: uuid }
    ProductMasterRecordId:
      in: path
      name: recordId
      required: true
      schema: { type: string, format: uuid }
    ProductMasterPage:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    ProductMasterPerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ProductMasterSearch:
      in: query
      name: q
      description: Case-insensitive code, name, parent, target, or agreement-number search where applicable.
      schema: { type: string, maxLength: 100 }
    ProductMasterStatusFilter:
      in: query
      name: status
      schema: { $ref: "#/components/schemas/ProductMasterStatus" }
    ProductMasterTypeFilter:
      in: query
      name: type
      description: Item classification or specification target type, depending on the resource.
      schema: { type: string, maxLength: 32 }
    ProductMasterParentFilter:
      in: query
      name: parent_id
      description: Brand, catalog item, output SKU, or specification-target identifier, depending on the resource.
      schema: { type: string, format: uuid }
    ProductMasterSort:
      in: query
      name: sort
      schema: { type: string, enum: [CODE, NAME, NEWEST, OLDEST], default: CODE }
    CaseId:
      in: path
      name: caseId
      required: true
      schema: { type: string, format: uuid }
    ApprovalId:
      in: path
      name: approvalId
      required: true
      schema: { type: string, format: uuid }
    EvidenceId:
      in: path
      name: evidenceId
      required: true
      schema: { type: string, format: uuid }
    AuditId:
      in: path
      name: auditId
      required: true
      schema: { type: string, format: uuid }
    OutboxEventId:
      in: path
      name: eventId
      required: true
      schema: { type: string, format: uuid }
    WorkItemId:
      in: path
      name: workItemId
      required: true
      schema: { type: string, format: uuid }
    CompanyId:
      in: path
      name: companyId
      required: true
      schema: { type: string, format: uuid }
    PlantId:
      in: path
      name: plantId
      required: true
      schema: { type: string, format: uuid }
    LocationId:
      in: path
      name: locationId
      required: true
      schema: { type: string, format: uuid }
    UserId:
      in: path
      name: userId
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      in: path
      name: roleId
      required: true
      schema: { type: string, format: uuid }
    PermissionId:
      in: path
      name: permissionId
      required: true
      schema: { type: string, format: uuid }
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      in: path
      name: invitationId
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string, format: uuid }
    ApprovalRuleId:
      in: path
      name: ruleId
