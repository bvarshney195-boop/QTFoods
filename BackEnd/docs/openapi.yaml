  /sales/unsold-returns/{caseId}/evidence:
    post:
      operationId: uploadUnsoldReturnEvidence
      summary: Attach retained evidence to an unsold return case
      description: Requires the dedicated evidence permission. The file is stored on a private disk, assigned a server-controlled retention date, SHA-256 hashed, linked to an upload audit event, and appended with the next case record version. Exact idempotent replay returns the first result.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category:
                  type: string
                  enum: [RETURN_CONFIRMATION, RECEIPT_PHOTO, QUALITY_REPORT, FINANCE_DOCUMENT, OTHER]
                notes: { type: [string, "null"], maxLength: 2000 }
                file:
                  type: string
                  format: binary
                  description: PDF, JPEG, PNG, WebP, or plain text; 10 MiB by default.
      responses:
        "201":
          description: Evidence stored and linked to the case and audit ledger
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UnsoldReturnEvidenceUploadResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

