    post:
      summary: Confirm physical receipt into return quarantine
      description: Validates the destination against the case company, plant, SKU, lot, UOM, and active return-quarantine location; updates the quarantine balance and emits one stock movement per submitted line in the same transaction. Replaying the same idempotency key and payload returns the first result.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [line_id, received_quantity, return_position_id]
                    properties:
                      line_id: { type: string, format: uuid }
                      received_quantity: { type: string }
                      return_position_id: { type: string, format: uuid }
      responses:
        "200":
          description: Receipt and quarantine stock movements recorded
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/UnsoldReturnCommandResult" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

