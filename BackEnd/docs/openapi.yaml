    get:
      operationId: downloadUnsoldReturnEvidence
      summary: Download scoped private evidence
      description: Requires the dedicated evidence permission, returns 404 outside the active company and plant, forces attachment delivery with no-store headers, and records successful access in the audit ledger.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CaseId"
        - $ref: "#/components/parameters/EvidenceId"
      responses:
        "200":
          description: Private evidence stream
          headers:
            Content-Disposition:
              schema: { type: string }
            Cache-Control:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ContextRequired" }

