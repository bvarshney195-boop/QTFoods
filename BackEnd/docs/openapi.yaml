  schemas:
    OptimisationInputCommand:
      type: object
      required: [demand_plan_id, objective, service_level_target, safety_stock_percent, planning_lead_days, max_utilisation_percent, holding_cost_rate, shortage_penalty_rate, currency]
      properties:
        demand_plan_id:
          type: string
          format: uuid
          description: Released demand plan whose current version and scoped operational facts will be snapshotted immutably.
        objective: { type: string, enum: [BALANCED, SERVICE, COST, INVENTORY] }
        service_level_target: { type: [number, string], exclusiveMinimum: 0, maximum: 100 }
        safety_stock_percent: { type: [number, string], minimum: 0, maximum: 100 }
        planning_lead_days: { type: integer, minimum: 0, maximum: 365 }
        max_utilisation_percent: { type: [number, string], exclusiveMinimum: 0, maximum: 100 }
        holding_cost_rate: { type: [number, string], minimum: 0 }
        shortage_penalty_rate: { type: [number, string], minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        assumptions: { type: [string, "null"], maxLength: 4000 }
    OptimisationCreateCommand:
      allOf:
        - $ref: "#/components/schemas/OptimisationInputCommand"
        - type: object
          required: [plan_number, name]
          properties:
            plan_number: { type: string, maxLength: 80, pattern: '^[A-Z0-9][A-Z0-9_/-]*$' }
            name: { type: string, minLength: 3, maxLength: 160 }
    P2JsonCommand:
      type: object
      description: Command-specific JSON object. Server validation rejects unknown lifecycle transitions, incompatible scoped references, invalid quantities or amounts, and unbalanced accounting lines.
      additionalProperties: true
    P2Record:
      type: object
      required: [id]
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        record_version: { type: integer, minimum: 1 }
        allowed_actions:
          type: array
          items: { type: string }
    P2Workspace:
      type: object
      required: [data, meta, summary, lookups, allowed_actions]
      additionalProperties: true
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/P2Record" }
        meta:
          type: object
          additionalProperties: true
          properties:
            total: { type: integer, minimum: 0 }
        summary:
          type: object
          additionalProperties: true
        lookups:
          type: object
          additionalProperties: true
        allowed_actions:
          type: array
          items: { type: string }
        scope:
          type: object
          additionalProperties: true
          properties:
            company_id: { type: string, format: uuid }
            plant_id: { type: string, format: uuid }
    P2CommandResult:
      type: object
      required: [id, status, record_version]
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        entity_type: { type: string }
        status: { type: string }
        record_version: { type: integer, minimum: 1 }
    DemandPlanWrite:
      type: object
      required: [name, horizon_start, horizon_end, lines]
      properties:
        name: { type: string, minLength: 3, maxLength: 160 }
        horizon_start: { type: string, format: date }
        horizon_end: { type: string, format: date }
        notes: { type: [string, "null"], maxLength: 4000 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [output_sku_id, demand_date, demand_type, quantity]
            properties:
              output_sku_id: { type: string, format: uuid }
              demand_date: { type: string, format: date }
              demand_type: { type: string, enum: [FORECAST, FIRM, SAFETY_STOCK] }
              quantity: { type: number, exclusiveMinimum: 0, maximum: 99999999999999 }
              notes: { type: [string, "null"], maxLength: 1000 }
    ProductionScheduleWrite:
      type: object
      required: [horizon_start, horizon_end, lines, capacities]
      properties:
        horizon_start: { type: string, format: date }
        horizon_end: { type: string, format: date }
        notes: { type: [string, "null"], maxLength: 4000 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [mrp_planned_order_id, planned_start_date, planned_end_date]
            properties:
              mrp_planned_order_id: { type: string, format: uuid }
              planned_start_date: { type: string, format: date }
              planned_end_date: { type: string, format: date }
        capacities:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [work_center_code, daily_capacity_minutes]
            properties:
              work_center_code: { type: string, maxLength: 64 }
              daily_capacity_minutes: { type: number, exclusiveMinimum: 0, maximum: 99999999999999 }
    PackagingArtworkWrite:
      type: object
      required: [label_name, barcode, coding_template, effective_from]
      properties:
        label_name: { type: string, minLength: 2, maxLength: 160 }
        barcode: { type: string, minLength: 4, maxLength: 80 }
        coding_template: { type: string, minLength: 3, maxLength: 255 }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, "null"], format: date }
        notes: { type: [string, "null"], maxLength: 4000 }
    ManufacturingRecord:
      type: object
      description: Screen-specific production order, stage, output, sample, safety record, artwork, packing run, finished lot, trace graph, recall, or batch-cost payload.
      additionalProperties: true
    ManufacturingWorkspace:
      type: object
      required: [data, meta, summary, lookups, allowed_actions]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ManufacturingRecord" } }
        meta: { $ref: "#/components/schemas/InventoryPaginationMeta" }
        summary: { type: object, additionalProperties: true }
        lookups: { type: object, additionalProperties: true }
        allowed_actions: { type: array, items: { type: string } }
    ManufacturingCommandResult:
      type: object
      required: [entity_type, id, status]
      properties:
        entity_type: { type: string }
        id: { type: string, format: uuid }
        status: { type: string }
        record_version: { type: integer, minimum: 1 }
        order_record_version: { type: integer, minimum: 1 }
        snapshot_version: { type: integer, minimum: 1 }
        output_event_id: { type: string, format: uuid }
        finished_lot_id: { type: string, format: uuid }
      additionalProperties: true
    ProductMasterStatus:
      type: string
      enum: [DRAFT, ACTIVE, INACTIVE]
    ProductMasterCreateIdentity:
      type: object
      required: [code, status]
      properties:
        code: { type: string, maxLength: 64, pattern: '^[A-Z0-9][A-Z0-9_-]*$' }
        status: { type: string, enum: [DRAFT, ACTIVE] }
    ProductMasterReference:
      type: object
      required: [id, code, name, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string }
    ProductMasterStatusChangeView:
      type: object
      required: [reason, changed_at, changed_by]
      properties:
        reason: { type: [string, "null"] }
        changed_at: { type: string, format: date-time }
        changed_by:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            - type: "null"
    ProductMasterListItem:
      type: object
      required: [id, company_id, code, name, status, record_version, child_count, child_label, parent, status_change, allowed_actions, allowed_statuses, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/ProductMasterStatus" }
        record_version: { type: integer, minimum: 1 }
        child_count: { type: integer, minimum: 0 }
        child_label: { type: string, enum: [agreements, conversions, packs, components, operations, parameters] }
        parent:
          oneOf:
            - type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
            - type: "null"
        status_change:
          oneOf:
            - $ref: "#/components/schemas/ProductMasterStatusChangeView"
            - type: "null"
        allowed_actions: { type: array, items: { type: string, enum: [UPDATE, CHANGE_STATUS] } }
        allowed_statuses: { type: array, items: { $ref: "#/components/schemas/ProductMasterStatus" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        description: { type: [string, "null"] }
        brand_id: { type: [string, "null"], format: uuid }
        item_type: { type: string }
        base_uom: { type: string }
        shelf_life_days: { type: [integer, "null"], minimum: 0 }
        lot_controlled: { type: boolean }
        catalog_item_id: { type: [string, "null"], format: uuid }
        barcode: { type: [string, "null"] }
        pack_quantity: { type: string }
        pack_uom_code: { type: [string, "null"] }
        revision: { type: integer, minimum: 1 }
        output_sku_id: { type: string, format: uuid }
        output_quantity: { type: string }
        output_uom_code: { type: string }
        yield_percent: { type: string }
        effective_from: { type: [string, "null"], format: date }
        effective_to: { type: [string, "null"], format: date }
        notes: { type: [string, "null"] }
        target_type: { type: string, enum: [ITEM, SKU] }
        sku_id: { type: [string, "null"], format: uuid }
