x-production-environment: &production-environment
  APP_NAME: Q & T FOODS ERP
  APP_ENV: production
  APP_KEY: "${APP_KEY:?APP_KEY is required}"
  APP_DEBUG: "false"
  APP_URL: "https://${APP_HOST:?APP_HOST is required}"
  APP_TIMEZONE: "${APP_TIMEZONE:-UTC}"
  LOG_CHANNEL: stderr
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
  DB_USERNAME: "${DB_USERNAME:?DB_USERNAME is required}"
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
  DB_MASK_BINDINGS: "true"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
  REDIS_DB: "${REDIS_DB:-0}"
  REDIS_CACHE_DB: "${REDIS_CACHE_DB:-1}"
  SESSION_COOKIE: qt_foods_erp_session
  SESSION_ENCRYPT: "true"
  SESSION_SECURE_COOKIE: "true"
  SESSION_HTTP_ONLY: "true"
  SESSION_SAME_SITE: lax
  FILESYSTEM_DISK: local
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
  AWS_BUCKET: "${AWS_BUCKET:?AWS_BUCKET is required}"
  AWS_ENDPOINT: "${AWS_ENDPOINT:?AWS_ENDPOINT is required}"
  AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-false}"
  AWS_CONNECT_TIMEOUT_SECONDS: "${AWS_CONNECT_TIMEOUT_SECONDS:-2}"
  AWS_REQUEST_TIMEOUT_SECONDS: "${AWS_REQUEST_TIMEOUT_SECONDS:-5}"
  MAIL_MAILER: "${MAIL_MAILER:-smtp}"
  MAIL_SCHEME: "${MAIL_SCHEME:-smtp}"
  MAIL_REQUIRE_TLS: "true"
  MAIL_HOST: "${MAIL_HOST:?MAIL_HOST is required}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME:?MAIL_USERNAME is required}"
  MAIL_PASSWORD: "${MAIL_PASSWORD:?MAIL_PASSWORD is required}"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS is required}"
  MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Q & T Foods ERP}"
  QT_FRONTEND_URL: "${QT_FRONTEND_URL:?QT_FRONTEND_URL is required}"
  QT_CORS_ALLOWED_ORIGINS: "${QT_CORS_ALLOWED_ORIGINS:?QT_CORS_ALLOWED_ORIGINS is required}"
  QT_TRUSTED_HOSTS: "${APP_HOST:?APP_HOST is required}"
  QT_TRUSTED_PROXIES: REMOTE_ADDR
  QT_ENFORCE_HTTPS: "true"
  QT_HSTS_MAX_AGE: 31536000
  QT_ALLOW_DEMO_SEEDERS: "false"
  QT_ALLOW_DEMO_AUTHENTICATION: "false"
  QT_IDENTITY_PREVIEW_LINKS: "false"
  QT_EVIDENCE_DISK: evidence
  QT_PRIVATE_DOCUMENT_DISK: private
  QT_EVIDENCE_RETENTION_YEARS: "${QT_EVIDENCE_RETENTION_YEARS:-7}"
  QT_EVIDENCE_RETENTION_POLICY: "${QT_EVIDENCE_RETENTION_POLICY:-UNSOLD_RETURN_7Y}"
  QT_EVIDENCE_MAX_UPLOAD_KB: "${QT_EVIDENCE_MAX_UPLOAD_KB:-10240}"
  QT_OUTBOX_TRANSPORT: "${QT_OUTBOX_TRANSPORT:-log}"
  QT_OUTBOX_HTTP_ENDPOINT: "${QT_OUTBOX_HTTP_ENDPOINT:-}"
  QT_OUTBOX_SIGNING_SECRET: "${QT_OUTBOX_SIGNING_SECRET:-}"
  QT_OUTBOX_TIMEOUT_SECONDS: "${QT_OUTBOX_TIMEOUT_SECONDS:-10}"
  QT_OUTBOX_REQUIRE_ACKNOWLEDGEMENT: "true"
  QT_OUTBOX_ACKNOWLEDGEMENT_HEADER: X-Acknowledgement-ID
  QT_OUTBOX_REQUIRE_BOUND_ACKNOWLEDGEMENT: "true"
  QT_OUTBOX_ACKNOWLEDGED_EVENT_HEADER: X-Acknowledged-Event-ID
  QT_OUTBOX_BATCH_SIZE: "${QT_OUTBOX_BATCH_SIZE:-50}"
  QT_OUTBOX_MAX_ATTEMPTS: "${QT_OUTBOX_MAX_ATTEMPTS:-8}"
  QT_OUTBOX_BASE_RETRY_SECONDS: "${QT_OUTBOX_BASE_RETRY_SECONDS:-30}"
  QT_OUTBOX_MAX_RETRY_SECONDS: "${QT_OUTBOX_MAX_RETRY_SECONDS:-3600}"
  QT_OUTBOX_LOCK_TIMEOUT_SECONDS: "${QT_OUTBOX_LOCK_TIMEOUT_SECONDS:-300}"
  QT_METRICS_TOKEN: "${QT_METRICS_TOKEN:?QT_METRICS_TOKEN is required}"
  QT_SLOW_REQUEST_MS: "${QT_SLOW_REQUEST_MS:-1000}"
  QT_HTTP_METRICS_RETENTION_SECONDS: "${QT_HTTP_METRICS_RETENTION_SECONDS:-2592000}"
  QT_READINESS_DATABASE: "true"
  QT_READINESS_REDIS: "true"
  QT_READINESS_OBJECT_STORAGE: "true"
  QT_MONITORED_QUEUES: "${QT_MONITORED_QUEUES:-outbox,default}"
  QT_AUDIT_MONITOR_WINDOW_MINUTES: "${QT_AUDIT_MONITOR_WINDOW_MINUTES:-60}"
  QT_ALERT_FAILED_JOBS_MAX: "${QT_ALERT_FAILED_JOBS_MAX:-0}"
  QT_ALERT_OUTBOX_QUARANTINED_MAX: "${QT_ALERT_OUTBOX_QUARANTINED_MAX:-0}"
  QT_ALERT_OUTBOX_RETRY_MAX: "${QT_ALERT_OUTBOX_RETRY_MAX:-20}"
  QT_ALERT_OUTBOX_OLDEST_DUE_SECONDS: "${QT_ALERT_OUTBOX_OLDEST_DUE_SECONDS:-300}"
  QT_ALERT_QUEUE_DEPTH_MAX: "${QT_ALERT_QUEUE_DEPTH_MAX:-1000}"
  QT_ALERT_AUDIT_MISSING_CONTEXT_MAX: "${QT_ALERT_AUDIT_MISSING_CONTEXT_MAX:-0}"
  QT_ALERT_TRANSPORT: "${QT_ALERT_TRANSPORT:-log}"
  QT_ALERT_HTTP_ENDPOINT: "${QT_ALERT_HTTP_ENDPOINT:-}"
  QT_ALERT_SIGNING_SECRET: "${QT_ALERT_SIGNING_SECRET:-}"
  QT_ALERT_TIMEOUT_SECONDS: "${QT_ALERT_TIMEOUT_SECONDS:-10}"
  QT_ALERT_RENOTIFY_SECONDS: "${QT_ALERT_RENOTIFY_SECONDS:-3600}"
  QT_BACKUP_RETENTION_DAYS: "${QT_BACKUP_RETENTION_DAYS:-35}"
  QT_RECOVERY_RPO_MINUTES: "${QT_RECOVERY_RPO_MINUTES:-1440}"
  QT_RECOVERY_RTO_MINUTES: "${QT_RECOVERY_RTO_MINUTES:-240}"
  QT_RECOVERY_OBJECT_LIMIT: "${QT_RECOVERY_OBJECT_LIMIT:-100000}"

x-app-image: &app-image
  image: "qtfoods-erp-backend:${IMAGE_TAG:-production}"
  build:
    context: .
    dockerfile: Dockerfile.production
    target: app

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  migrate:
    <<: *app-image
    command:
      - sh
      - -lc
      - php artisan qt:deployment:verify && php artisan migrate --force && php artisan qt:security:verify-identities
    environment: *production-environment
    depends_on: *app-dependencies
    restart: "no"

  recovery:
    profiles: [recovery]
    image: "qtfoods-erp-recovery:${IMAGE_TAG:-production}"
    build:
      context: .
      dockerfile: Dockerfile.production
      target: recovery
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${DB_DATABASE:?DB_DATABASE is required}"
      PGUSER: "${DB_USERNAME:?DB_USERNAME is required}"
      PGPASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:?AWS_ENDPOINT is required}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:?AWS_BUCKET is required}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-false}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      REDIS_DB: "${REDIS_DB:-0}"
      REDIS_CACHE_DB: "${REDIS_CACHE_DB:-1}"
      QT_BACKUP_ROOT: /backups
      QT_BACKUP_RETENTION_DAYS: "${QT_BACKUP_RETENTION_DAYS:-35}"
      QT_RECOVERY_RPO_MINUTES: "${QT_RECOVERY_RPO_MINUTES:-1440}"
      QT_RECOVERY_RTO_MINUTES: "${QT_RECOVERY_RTO_MINUTES:-240}"
      QT_RECOVERY_WRITERS_STOPPED: "${QT_RECOVERY_WRITERS_STOPPED:-NO}"
      QT_BACKUP_STORAGE_PROTECTED: "${QT_BACKUP_STORAGE_PROTECTED:-NO}"
      QT_RECOVERY_CONFIRM: "${QT_RECOVERY_CONFIRM:-}"
      IMAGE_TAG: "${IMAGE_TAG:-production}"
    volumes:
      - type: bind
        source: "${QT_BACKUP_HOST_PATH:?QT_BACKUP_HOST_PATH is required}"
        target: /backups
    depends_on: *app-dependencies
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    restart: "no"

  app:
    <<: *app-image
    environment: *production-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *app-image
    command:
      - sh
      - -lc
      - php artisan qt:deployment:verify && php artisan queue:work redis --queue=outbox,default --sleep=2 --tries=1 --timeout=120
    environment: *production-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  scheduler:
    <<: *app-image
    command:
      - sh
      - -lc
      - php artisan qt:deployment:verify && php artisan schedule:work
    environment: *production-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  gateway:
    image: "qtfoods-erp-gateway:${IMAGE_TAG:-production}"
    build:
      context: .
      dockerfile: Dockerfile.production
      target: web
    environment:
      APP_HOST: "${APP_HOST:?APP_HOST is required}"
      ACME_EMAIL: "${ACME_EMAIL:?ACME_EMAIL is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE is required}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME is required}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
    volumes:
      - qt_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8@sha256:298e5b3bc566bade82f46ad5511777a4a07a294097ce16ada2f6a42be5239df5
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - qt_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  qt_pg:
  qt_redis:
  caddy_data:
  caddy_config:
